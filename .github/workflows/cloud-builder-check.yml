name: Cloud builder validation
on:
  push:
    paths:
      - 'cloud-builder/**'
      - '.github/workflows/cloud-builder-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and import service
        run: |
          python -m pip install -r cloud-builder/requirements.txt
          python -m py_compile cloud-builder/app.py
          cd cloud-builder
          python -c "from app import app; print(app.title)"
          python -m unittest discover -s tests -v
