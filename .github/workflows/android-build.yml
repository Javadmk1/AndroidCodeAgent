name: Android debug build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run unit tests
        run: gradle -p android --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle -p android --no-daemon assembleDebug
      - name: Verify debug APK and create checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"
      - name: Build signed release APK when signing secrets exist
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          configured=0
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            if [ -n "$value" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -eq 0 ]; then
            echo "Release signing secrets are not configured; skipping signed release build."
            exit 0
          fi
          if [ "$configured" -ne 4 ]; then
            echo "Incomplete release signing configuration: all four GitHub Actions secrets are required."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/release-keystore.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          export ANDROID_KEYSTORE_PATH="$KEYSTORE"
          gradle -p android --no-daemon assembleRelease
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"
      - name: Upload debug APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: android-code-agent-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload signed release APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: android-code-agent-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: ignore
          retention-days: 30
