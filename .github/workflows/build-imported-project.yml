name: Build imported Android project
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Public GitHub repository in owner/name form
        required: true
        type: string
      ref:
        description: Branch, tag or commit to build
        required: true
        default: main
        type: string
      project_dir:
        description: Project folder inside the repository (use . for repository root)
        required: true
        default: .
        type: string
      gradle_task:
        description: Allowed Gradle task
        required: true
        default: assembleDebug
        type: choice
        options:
          - assembleDebug
          - testDebugUnitTest
          - lintDebug
          - check
          - tasks

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate build inputs
        shell: bash
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          SOURCE_REF: ${{ inputs.ref }}
          PROJECT_DIR: ${{ inputs.project_dir }}
          GRADLE_TASK: ${{ inputs.gradle_task }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "repository must be owner/name"; exit 1; }
          [[ -n "$SOURCE_REF" && "$SOURCE_REF" != -* && "$SOURCE_REF" != *".."* && "$SOURCE_REF" != *$'\\n'* ]] || { echo "Invalid ref"; exit 1; }
          [[ "$PROJECT_DIR" == "." || ( "$PROJECT_DIR" != /* && "$PROJECT_DIR" != *".."* && "$PROJECT_DIR" =~ ^[A-Za-z0-9_./-]+$ ) ]] || { echo "Invalid project directory"; exit 1; }
          case "$GRADLE_TASK" in
            assembleDebug|testDebugUnitTest|lintDebug|check|tasks) ;;
            *) echo "Gradle task is not allowed"; exit 1 ;;
          esac

      - name: Checkout public source project
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          path: source
          persist-credentials: false

      - name: Verify project directory
        shell: bash
        env:
          PROJECT_DIR: ${{ inputs.project_dir }}
        run: |
          set -euo pipefail
          PROJECT_PATH="source/$PROJECT_DIR"
          test -d "$PROJECT_PATH"
          test -f "$PROJECT_PATH/gradlew" || test -f "$PROJECT_PATH/build.gradle" || test -f "$PROJECT_PATH/build.gradle.kts" || test -f "$PROJECT_PATH/settings.gradle" || test -f "$PROJECT_PATH/settings.gradle.kts"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: ${{ inputs.gradle_task != 'tasks' }}
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Run approved Gradle task
        shell: bash
        env:
          PROJECT_DIR: ${{ inputs.project_dir }}
          GRADLE_TASK: ${{ inputs.gradle_task }}
          BUILD_LOG: ${{ github.workspace }}/gradle-build.log
        run: |
          set -euo pipefail
          cd "source/$PROJECT_DIR"
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --console=plain "$GRADLE_TASK" 2>&1 | tee "$BUILD_LOG"
          else
            gradle --no-daemon --console=plain "$GRADLE_TASK" 2>&1 | tee "$BUILD_LOG"
          fi

      - name: Collect APK outputs
        if: ${{ inputs.gradle_task == 'assembleDebug' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-output
          find source -type f -path '*/build/outputs/apk/*/*.apk' -not -path '*/build/outputs/apk/androidTest/*' -exec cp --parents {} build-output/ ;
          find build-output -type f -name '*.apk' -print -quit | grep -q . || { echo "No APK was produced"; exit 1; }
          find build-output -type f -name '*.apk' -exec sha256sum {} \; > build-output/SHA256SUMS

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imported-project-build-log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK artifacts
        if: ${{ inputs.gradle_task == 'assembleDebug' }}
        uses: actions/upload-artifact@v4
        with:
          name: imported-project-apks
          path: build-output/
          if-no-files-found: error
          retention-days: 14
